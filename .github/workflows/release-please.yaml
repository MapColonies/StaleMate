on:
  push:
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A personal access token, so the release tag it pushes triggers build-and-push.
          token: ${{ secrets.GH_PAT }}
