apiVersion: v2
name: stalemate
description: A Helm chart for StaleMate, the infra Team's PR dashboard
type: application
version: 2.0.0 # x-release-please-version
dependencies:
  - name: stalemate-api
    repository: file://../apps/api/helm
    condition: api.enabled
    alias: api
    version: 2.0.0 # x-release-please-version
  - name: nginx
    repository: oci://acrarolibotnonprod.azurecr.io/helm/common
    condition: ui.enabled
    alias: ui
    version: 2.4.0
