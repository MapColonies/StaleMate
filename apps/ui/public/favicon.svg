<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The theme's primary and primary-foreground colours, as hex: CSS variables don't reach a favicon. It follows the OS theme, not the app's toggle, because the browser's tab strip does. -->
  <style>
    .badge { fill: #0f172a; }
    .glyph { stroke: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      .badge { fill: #e2e8f0; }
      .glyph { stroke: #0f172a; }
    }
  </style>
  <rect class="badge" width="32" height="32" rx="7" />
  <g class="glyph" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="9.5" />
    <path d="M16 10.5V16l3.5 2" />
  </g>
</svg>
