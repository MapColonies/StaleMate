{{- $chartName := include "stalemate-api.name" . -}}
{{- $tracingUrl := include "stalemate-api.tracingUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ $chartName }}-configmap
  labels:
    {{- include "stalemate-api.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .Values.env.logPrettyPrintEnabled | quote }}
  {{- if .Values.env.tracing.enabled }}
  TELEMETRY_TRACING_ENABLED: 'true'
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  {{- end }}
  EXCLUDED_TEAMS: {{ .Values.teams.excluded | toJson | quote }}
  BOTS_LOGINS: {{ .Values.bots.logins | toJson | quote }}
  EXTRA_NON_WORKING_DAYS: {{ .Values.extraNonWorkingDays | toJson | quote }}
  URGENCY_THRESHOLDS: {{ .Values.urgency.thresholds | toJson | quote }}
  EXCLUDED_CHECKS: {{ .Values.checks.excluded | toJson | quote }}
  JIRA_BASE_URL: {{ .Values.jira.baseUrl | quote }}
  JIRA_PROJECT_KEYS: {{ .Values.jira.projectKeys | toJson | quote }}
  SYNC_INTERVAL_MS: {{ .Values.sync.intervalMs | int64 | quote }}
  SYNC_REFRESH_COOLDOWN_MS: {{ .Values.sync.refreshCooldownMs | int64 | quote }}
  SYNC_TIERS_WARM_FROM_WORKING_DAYS: {{ .Values.sync.tiers.warmFromWorkingDays | quote }}
  SYNC_TIERS_COLD_FROM_WORKING_DAYS: {{ .Values.sync.tiers.coldFromWorkingDays | quote }}
  SYNC_TIERS_WARM_READ_INTERVAL_MS: {{ .Values.sync.tiers.warmReadIntervalMs | int64 | quote }}
  SYNC_TIERS_COLD_READ_INTERVAL_MS: {{ .Values.sync.tiers.coldReadIntervalMs | int64 | quote }}
  PROVIDER: github
  GITHUB_APP_ID: {{ required "githubApp.appId is required" .Values.githubApp.appId | int64 | quote }}
  GITHUB_APP_INSTALLATION_ID: {{ required "githubApp.installationId is required" .Values.githubApp.installationId | int64 | quote }}
  GITHUB_APP_PRIVATE_KEY_PATH: {{ include "stalemate-api.privateKeyPath" . | quote }}
{{- end }}
