{{- if .Values.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stalemate-api.githubAppSecretName" . }}
  labels:
    {{- include "stalemate-api.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "stalemate-api.privateKeyFileName" . }}: {{ required "githubApp.privateKey is required: the GitHub App's PEM private key" .Values.githubApp.privateKey | b64enc | quote }}
{{- end }}
