global:
  cloudProvider: {}
  tracing: {}

mclabels:
  component: backend
  owner: infra
  partOf: stalemate
  prometheus:
    enabled: true
  criticality: internal

enabled: true
# The sync loop and the Snapshot live in the pod's memory, so there is only ever one.
replicaCount: 1
revisionHistoryLimit: 5 # Amount of revisions we keep
initialDelaySeconds: 60
# The API is single-threaded, so a slow probe usually means a busy moment, not a dead process.
livenessProbe:
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 5
resetOnConfigChange: true

extraEnvVars: []
# extraEnvVars:
#   - name: LOG_LEVEL
#     value: debug

cloudProvider:
  dockerRegistryUrl: my-registry-url.io
  imagePullSecretName: 'my-registry-secret'
  flavor: openshift

ca:
  enabled: false
  secretName: 'root-ca'
  path: '/usr/local/share/ca-certificates'
  key: 'ca.crt'

image:
  repository: infra/stalemate-api
  # tag: 'latest'

env:
  port: 8080
  targetPort: 8080
  logLevel: info
  logPrettyPrintEnabled: false
  tracing:
    enabled: false
    url: http://localhost:55681/v1/trace

# The GitHub Team whose Team Repos and Team Members are tracked.
team:
  slug: infra
# Logins that count as Bots, on top of the accounts GitHub types as Bot.
bots:
  logins:
    - mapcolonies-devops
    - mapcolonies-org
# Extra days off, as YYYY-MM-DD in Asia/Jerusalem.
extraNonWorkingDays:
  - '2026-10-27'
# The Age in Working Days at which Urgency rises to levels 1, 2 and 3.
urgency:
  thresholds: [2, 4, 8]
# Check runs and status contexts that Check Status leaves out: the Jira validation's verdict and its always-green run.
checks:
  excluded:
    - jira/issue-validation
    - jira-validation
jira:
  # The Jira site Jira Tickets link to. Empty hides them, and whether a PR lacks one.
  baseUrl: https://mapcolonies.atlassian.net
  # The project keys whose issue keys in a PR title count as Jira Tickets.
  projectKeys:
    - MAPCO
sync:
  # How long to wait after a sweep ends before starting the next.
  intervalMs: 120000
  # How long after a sweep starts before "Refresh now" can start another.
  refreshCooldownMs: 30000
  # How often a sweep re-reads a Tracked PR, by its Idle Time. Hot PRs, idle under warmFromWorkingDays, are re-read every sweep.
  tiers:
    # The Idle Time in Working Days from which a PR is Warm.
    warmFromWorkingDays: 10
    # The Idle Time in Working Days, about 3 months, from which a PR is Cold.
    coldFromWorkingDays: 60
    # How long after a Warm PR was read before a sweep re-reads it.
    warmReadIntervalMs: 900000
    # How long after a Cold PR was read before a sweep re-reads it.
    coldReadIntervalMs: 3600000

githubApp:
  appId:
  installationId:
  # The App's PEM private key. The chart renders it into a Secret and mounts it read-only as a file.
  privateKey: ''

additionalPodAnnotations: {}

resources:
  enabled: true
  value:
    limits:
      cpu: '1'
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi

route:
  enabled: true
  path: /api
  host:
  timeout:
    enabled: false # defaults to 30s by openshift
    duration: 60s # supported units (us, ms, s, m, h, d)
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
    certificate:
    key:
    caCertificate:
